name: Scrape and publish Rainbowlers League

on:
  workflow_dispatch:
    inputs:
      backfill:
        description: Fetch all discoverable supported reports
        required: false
        type: boolean
        default: false

  schedule:
    - cron: "0 * * * 5" 

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rainbowlers-pages
  cancel-in-progress: false

env:
  TZ: America/Los_Angeles

jobs:
  scrape-build-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine whether this run should execute
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          local_day="$(TZ=America/Los_Angeles date +%u)"
          local_hour="$(TZ=America/Los_Angeles date +%H)"

          if [ "$local_day" = "5" ] && [ "$local_hour" = "13" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Python files
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m compileall -q scraper site_generator.py

      - name: Run scraper
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            python -m scraper.cli --output data --backfill --verbose
          else
            python -m scraper.cli --output data --verbose
          fi

      - name: Generate website
        if: steps.gate.outputs.run == 'true'
        run: |
          python site_generator.py

          # The site generator links to raw/filename.html.
          # Copy the downloaded snapshots so those links work on GitHub Pages.
          if [ -d "data/raw" ]; then
            mkdir -p site/raw
            cp -R data/raw/. site/raw/
          fi

      - name: Show generated files
        if: steps.gate.outputs.run == 'true'
        run: |
          echo "Generated site files:"
          find site -maxdepth 2 -type f -print | sort

          echo
          echo "Scraper index:"
          if [ -f data/index.json ]; then
            python -m json.tool data/index.json | head -200
          else
            echo "data/index.json was not created"
          fi

      - name: Configure GitHub Pages
        if: steps.gate.outputs.run == 'true'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.gate.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit updated data and site
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data site

          if git diff --cached --quiet; then
            echo "No data or site changes to commit."
          else
            git commit -m "Update Rainbowlers League reports"
            git push
          fi
